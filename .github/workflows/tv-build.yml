name: TV build

# Builds the TV APKs on every push to tv-redesign. Pushing a tag such as v1.8.5-tv.1 also publishes a GitHub Release.
on:
  push:
    branches: [tv-redesign]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # libv2ray.aar (Mahsa Xray-core) is git-ignored upstream. Pinned to the release the TV build was tested with.
  LIBV2RAY_URL: https://github.com/GFW-knocker/AndroidLibXrayLite/releases/download/v1.26.10-r2/libv2ray.aar
  LIBV2RAY_SHA256: 26ef6f733e6a571ab47124a68f85e56a8d43324e29e57cac7f0b6e3701aaf588
  # Certificate of the key testers' installs are signed with. A build signed with any other key cannot update them.
  CERT_SHA256: e91353e8860ea5786711cb01923a1bb7025c12e18a8127686725990bac81842f

jobs:
  build:
    # Pinned so the runner's preinstalled Android SDK and JDK don't change under the build.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: V2rayNG
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Fetch libv2ray.aar
        run: |
          curl -fsSL -o app/libs/libv2ray.aar "$LIBV2RAY_URL"
          echo "$LIBV2RAY_SHA256  app/libs/libv2ray.aar" | sha256sum -c -

      # Without this secret each run signs with a throwaway key, and testers would have to uninstall to update.
      - name: Use the shared signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            ks=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
            echo "::notice::The keystore in the secret has certificate $ks"
            # Without this, AGP on the runner ignored ~/.android and made a fresh debug key each run (cause not pinned down).
            echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set; this APK cannot update earlier installs."
          fi

      - name: Build and test
        run: ./gradlew --no-daemon :app:assembleDevDebug :app:testDevDebugUnitTest

      - name: Name the APKs
        run: |
          mkdir -p ../dist
          for abi in universal arm64-v8a armeabi-v7a; do
            cp "app/build/outputs/apk/dev/debug/v2rayNG_1.8.5-dev_${abi}.apk" "../dist/MahsaNG-TV-${GITHUB_REF_NAME//\//-}-${abi}.apk"
          done

      - name: Check the signing key
        run: |
          cert=$("$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/apksigner" verify --print-certs ../dist/*-universal.apk | sed -n 's/.*SHA-256 digest: //p')
          echo "::notice::The APK is signed with certificate $cert"
          [ "$cert" = "$CERT_SHA256" ] || { echo "::error::The APK is not signed with the testers' key ($CERT_SHA256)."; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: MahsaNG-TV-apks
          path: dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        # Re-pushing a tag replaces that release's APKs.
        run: |
          gh release upload "$GITHUB_REF_NAME" ../dist/*.apk --clobber ||
          gh release create "$GITHUB_REF_NAME" ../dist/*.apk --target "$GITHUB_SHA" --prerelease \
            --title "TV test build $GITHUB_REF_NAME" \
            --notes "Unofficial Android TV test build. Install the universal APK if unsure. See docs/android-tv.md for what this build includes and leaves out."
